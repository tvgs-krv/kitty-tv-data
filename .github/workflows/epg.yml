# Раз в сутки собирает epg.json — программу передач на двое суток только для каналов из config.json.
# Исходник iptvx.one весит 17 МБ сжатого XML; телевизору с 1 ГБ памяти разбирать его не под силу.
# Инструмент tools/ собран из приватного репозитория kitty-tv тем же кодом, что читает данные на телевизоре.
name: epg

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  epg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Собрать программу
        run: tools/bin/tools epg https://iptvx.one/epg/epg_lite.xml.gz config.json epg.json
      - name: Проверить данные
        run: tools/bin/tools validate .
      - name: Сохранить
        run: |
          git config user.name "kitty-tv-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.json
          git diff --cached --quiet || git commit -m "Программа передач $(date -u +%Y-%m-%d)"
          git push
